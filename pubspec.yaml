name: mockmyapp
description: "MockMyApp — design App Store and Google Play screenshots with real device frames."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Persistence
  #
  # Plain JSON files on disk, not a database — see `project_store.dart`, which
  # writes one `projects.json` under the documents directory. `drift`,
  # `drift_dev` and `sqlite3_flutter_libs` were declared here and never used;
  # the last of the three bundled native SQLite into every platform binary for
  # nothing, so all three are gone.
  path_provider: ^2.1.5
  path: ^1.9.1

  # Fonts, images, sharing
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  # SVG shape import, split across the two packages because the two halves have
  # opposite requirements. Both are already in the lock as transitive
  # dependencies of `flutter_svg`, and `depend_on_referenced_packages` makes
  # importing an undeclared package an analyzer warning — so these two lines
  # change no version solve and add no bytes to a build, they only make the
  # imports legal.
  #
  # `vector_graphics_compiler` is the SVG *document* parser, and flutter_svg's
  # own runtime loader already calls into it for every device frame this app
  # draws, so the whole thing is compiled into every build already. It is what
  # flattens `transform` attributes and resolves `<rect>`, `<circle>` and
  # `<polygon>` into real path commands — the two things a hand-rolled reader
  # gets silently wrong on a file that came out of Figma. It runs once, on
  # import, and may be as heavy as it likes.
  #
  # `path_parsing` is the *render*-side reader: four commands, no XML, and no
  # allocation beyond the path itself. It runs on every build and every pointer
  # hit-test, so it has to be tiny — see `domain/engine/svg_path.dart`.
  path_parsing: ^1.1.0
  vector_graphics_compiler: ^1.2.6
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  # 13.x is required on AGP 9: earlier majors apply the Kotlin Gradle Plugin
  # unconditionally, which Flutter now warns about and will eventually reject.
  # 13.x applies it only below AGP 9, so on this project it never does.
  share_plus: ^13.3.0
  # Browser APIs, for the one thing a browser has no filesystem equivalent of:
  # handing the user a file. Reached only through the conditional import in
  # `data/services/file_download.dart`, so it is never compiled into a device
  # build.
  web: ^1.1.1
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8
  # 11.x is required on Flutter 3.44+: IconData became a `final class`, and
  # 10.x subclasses it (IconDataSolid/Regular/Brands…), which fails to compile.
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.5.5
  # KNOWN KGP WARNING. 1.8.1 is the newest release and it applies the Kotlin
  # Gradle Plugin unconditionally, which Flutter warns about and will eventually
  # reject. There is no version to upgrade to; the fix has to come upstream, or
  # this dependency has to go. It only exists for the opt-in (default off)
  # Material You accent in Preferences — see `_harmonized` in app/app.dart —
  # so dropping it costs one settings toggle, not the theme.
  dynamic_color: ^1.8.1
  archive: ^4.0.9
  package_info_plus: ^10.2.1
  image: ^4.5.0
  pasteboard: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a real device/desktop window — the only way to see
  # the scene render with the platform's own text shaping and real fonts.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  # iOS and macOS build their plugins through Swift Package Manager; there is
  # no Podfile. Pinned here rather than left to each machine's `flutter
  # config`, so a machine or CI runner that has it switched off globally does
  # not quietly bring CocoaPods back. If a plugin without SwiftPM support is
  # ever added, Flutter recreates a Podfile to build it with CocoaPods; look
  # for a version of that plugin with SwiftPM support before committing one.
  config:
    enable-swift-package-manager: true
  # The web engine's fallback face. Flutter's web renderer needs a family
  # named exactly "Roboto" before it lays out any text, and when the font
  # manifest has none it downloads Roboto from fonts.gstatic.com at startup.
  # These are the same files google_fonts reads for the Roboto captions, so
  # they cost nothing extra; elsewhere every style names its own family
  # through google_fonts, and this one is only ever a fallback.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/google_fonts/Roboto-Regular.ttf
        - asset: assets/google_fonts/Roboto-Bold.ttf
          weight: 700
  assets:
    - assets/frames/manifest.json
    - assets/clipart/manifest.json
    - assets/elements/elements.json
    - assets/icons/lucide.json
    - assets/icons/LICENSE
    # Every face the app paints — the templates', the UI's own Inter and
    # JetBrains Mono, and every family the font picker offers — bundled, so
    # nothing depends on a download: google_fonts finds `Family-Variant.ttf` in
    # the asset manifest, and runtime fetching is off (lib/main.dart). The
    # table is `kBundledFonts` in lib/data/assets/studio_fonts.dart, and
    # `tool/bundle_google_fonts.py` adds a family. Licences (all OFL) sit
    # beside the files; see `registerBundledFontLicences`.
    - assets/google_fonts/
    - assets/templates/arrowrush/
    - assets/templates/sonary/
    - assets/clipart/arrows/
    - assets/clipart/speech/
    - assets/clipart/badges/
    - assets/clipart/bursts/
    - assets/clipart/accents/
    - assets/clipart/marks/
    - assets/clipart/figures/
    - assets/frames/google/Pixel 8 Pro/SVG/
    - assets/frames/google/Pixel 9 Pro/SVG/
    - assets/frames/google/Pixel 9 Pro XL/SVG/
    - assets/frames/motorola/Edge 50 Ultra/SVG/
    - assets/frames/nothing/Nothing Phone 2/SVG/
    - assets/frames/nothing/Nothing Phone 3a/SVG/
    - assets/frames/oneplus/OnePlus 12/SVG/
    - assets/frames/oneplus/OnePlus 13/SVG/
    - assets/frames/oppo/Find X7 Ultra/SVG/
    - assets/frames/oppo/Find X8 Pro/SVG/
    - assets/frames/samsung/Galaxy Note 10/SVG/
    - assets/frames/samsung/Galaxy Note 10 Plus/SVG/
    - assets/frames/samsung/Galaxy Note 20/SVG/
    - assets/frames/samsung/Galaxy Note 20 Ultra/SVG/
    - assets/frames/samsung/Galaxy S24 Ultra/SVG/
    - assets/frames/samsung/Galaxy S25/SVG/
    - assets/frames/samsung/Galaxy S26/SVG/
    - assets/frames/samsung/Galaxy S26 Ultra/SVG/
    - assets/frames/sony/Xperia 1 VI/SVG/
    - assets/frames/vivo/X100 Ultra/SVG/
    - assets/frames/vivo/X200 Pro/SVG/
    - assets/frames/xiaomi/Xiaomi 14 Ultra/SVG/
    - assets/frames/xiaomi/Xiaomi 15 Pro/SVG/
# Branding artwork is generated. The scene is authored in
# `tool/branding_scene.svg` — a phone building a store listing, the exported
# page tilted behind it, a check badge on the corner — and every target below
# is a subset of that one file, so the icon, the adaptive layers and the splash
# images cannot drift apart. Edit the SVG (or `tool/generate_branding.py` for
# how it is assembled), never these PNGs; the per-target SVG each PNG was
# rendered from lands beside it in assets/branding/.
#
#   python tool/generate_branding.py
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  # iOS rejects an icon with an alpha channel; the source is opaque already,
  # but this makes that a guarantee rather than an assumption.
  remove_alpha_ios: true
  # Adaptive icons are two layers, and only the middle 66% of the foreground
  # survives the launcher's mask — so the glyph carries the mark alone and the
  # ground is its own layer. An image, not a flat colour, so Android gets the
  # same lit gradient as iOS rather than a duller solid navy.
  adaptive_icon_background: "assets/branding/app_icon_background.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  # The desktop and web targets, which this config used to leave out — so those
  # three builds still shipped Flutter's stock blue logo while Android and iOS
  # carried the real mark. They take the same 1024 source; the tool downsamples.
  #
  # `generate: true` is required on each: unlike `android`/`ios`, these are maps
  # rather than booleans, and a map that is merely present does nothing.
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    # The .ico Windows shows in the taskbar and title bar. 256 is the format's
    # largest frame, and the tool writes the smaller ones from it.
    icon_size: 256
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    # Both match the splash and the app's own default dark ground, so the PWA
    # install prompt and the browser chrome do not flash a colour the app never
    # uses. Same value as `flutter_native_splash.color` below.
    background_color: "#1E1F22"
    theme_color: "#1E1F22"

flutter_native_splash:
  # The dark studio ground, matching the icon and the app's default theme —
  # deliberately not the system's light/dark, because the app itself defaults
  # to dark regardless and a light splash into a dark workspace flashes.
  color: "#1E1F22"
  image: "assets/branding/splash_logo.png"
  android_12:
    # Android 12+ crops the splash icon to a 768px circle on a 1152px canvas,
    # so this variant carries a much smaller glyph on a wider board. It pointed
    # at splash_logo.png, which is neither — the mark was being cropped by the
    # circle it was drawn to fill.
    image: "assets/branding/splash_android12.png"
    icon_background_color: "#1E1F22"
